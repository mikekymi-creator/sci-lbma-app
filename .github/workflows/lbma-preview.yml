name: LBMA — lien de prévisualisation
on:
  push:
    branches: [feature/lbma-basecamp-v0-2]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lbma-pages-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LBMA_DEPLOYMENT_MODE: ${{ vars.LBMA_DEPLOYMENT_MODE || 'demo' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run preview:build
      # Testable next-generation interface: separate URL, demo-only.
      # Do not replace the current LBMA root or access private SCI data.
      - uses: actions/checkout@v4
        with:
          ref: feature/lbma-reboot-v0
          path: reboot-worktree
          persist-credentials: false
      - name: Build LBMA 2.0 V0.2 PWA separately
        env:
          LBMA_DEPLOYMENT_MODE: demo
          LBMA_REBOOT_BASE: /sci-lbma-app/reboot/
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
        run: |
          cd reboot-worktree
          npm ci --no-audit --no-fund
          npm run reboot:build
          cd ..
          mkdir -p preview-dist/reboot
          cp -R reboot-worktree/reboot-dist/. preview-dist/reboot/
      # Optional, separately authenticated SCI application. GitHub Pages still
      # hosts only static assets; Supabase RLS protects all family records.
      # Both activation flags must be explicitly enabled by the maintainer.
      - name: Verify family activation variables
        if: ${{ vars.LBMA_FAMILY_ENABLED == 'true' && vars.LBMA_FAMILY_RLS_CONFIRMED == 'true' }}
        env:
          FAMILY_URL: ${{ vars.LBMA_FAMILY_SUPABASE_URL }}
          FAMILY_PUBLIC_KEY: ${{ vars.LBMA_FAMILY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$FAMILY_URL" ] || [ -z "$FAMILY_PUBLIC_KEY" ]; then
            echo "Family PWA activation requires the project URL and a PUBLIC Supabase key."
            exit 1
          fi
      - name: Build LBMA 2.0 V0.3 authenticated family PWA
        if: ${{ vars.LBMA_FAMILY_ENABLED == 'true' && vars.LBMA_FAMILY_RLS_CONFIRMED == 'true' }}
        env:
          LBMA_DEPLOYMENT_MODE: connected
          LBMA_REBOOT_BASE: /sci-lbma-app/famille/
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.LBMA_FAMILY_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LBMA_FAMILY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd reboot-worktree
          npm run reboot:build
          cd ..
          mkdir -p preview-dist/famille
          cp -R reboot-worktree/reboot-dist/. preview-dist/famille/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
