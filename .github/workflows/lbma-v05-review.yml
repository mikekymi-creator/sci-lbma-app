name: LBMA 0.5 — Review checks
on:
  push:
    branches: [feature/lbma-v0-5-two-stage-review, feature/lbma-v0-5-1-inline-edit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run preview:build
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run preview:test
      - run: npm run test:browser
